name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OpenGL (EGL) for offscreen MuJoCo rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sim]" -r backend/requirements.txt
      - name: Ruff (core library)
        run: python -m ruff check .
      - name: Pylint (backend)
        working-directory: backend
        run: python -m pylint src main.py --fail-under=9.5
      - name: Tests
        env:
          MUJOCO_GL: ${{ runner.os == 'Linux' && 'egl' || '' }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
