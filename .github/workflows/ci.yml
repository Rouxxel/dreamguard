name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r backend/requirements.txt
      - name: Ruff (core library)
        run: python -m ruff check .
      - name: Pylint (backend)
        working-directory: backend
        run: python -m pylint src main.py --fail-under=9.5
      - name: Tests
        run: python -m pytest -q
